services:
  aterratreme:
    build: .
    restart: unless-stopped
    # Coolify: do NOT publish host ports — that breaks Traefik and causes Bad Gateway.
    # Coolify routes via expose + "Ports Exposes" / EXPOSE. For local access only, uncomment:
    # ports:
    #   - "9076:80"
    expose:
      - "80"
    environment:
      PORT: "80"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
